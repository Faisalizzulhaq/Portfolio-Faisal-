# Hostinger VPS (Docker + Traefik template). The existing Traefik project handles HTTPS.
# "media" pulls the site from the public Portfolio-Faisal- repo, then downloads and
# encodes every video from Google Drive. Re-run the project to publish a new version.
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - site:/usr/share/nginx/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.portfolio.loadbalancer.server.port=80
      - traefik.http.routers.portfolio.rule=Host(`faisalportofolio.site`) || Host(`www.faisalportofolio.site`) || Host(`portfolio.31-97-187-160.sslip.io`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-path.rule=Host(`srv1997963.hstgr.cloud`) && PathPrefix(`/portfolio`)
      - traefik.http.routers.portfolio-path.entrypoints=websecure
      - traefik.http.routers.portfolio-path.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-path.middlewares=portfolio-slash,portfolio-strip
      - traefik.http.middlewares.portfolio-slash.redirectregex.regex=^(https?://[^/]+/portfolio)$$
      - traefik.http.middlewares.portfolio-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.portfolio-strip.stripprefix.prefixes=/portfolio

  media:
    image: python:3.12-slim
    restart: "no"
    environment:
      # Bump on every site change so the redeploy recreates this container and re-copies the page.
      SITE_REV: "4"
    volumes:
      - site:/site
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/p && python -c "import io,tarfile,urllib.request;
        tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen('https://github.com/Faisalizzulhaq/Portfolio-Faisal-/archive/refs/heads/main.tar.gz').read())).extractall('/tmp/p')" &&
        cd /tmp/p/* && cp index.html /site/ && cp -r assets /site/ && cp deploy/build-media.sh /tmp/build-media.sh &&
        apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null &&
        pip install -q gdown && sh /tmp/build-media.sh

volumes:
  site:
